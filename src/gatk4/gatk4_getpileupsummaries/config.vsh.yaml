name: gatk4_getpileupsummaries
namespace: gatk4
description: |
  Summarizes the read counts of a sample at a set of known variant sites,
  for use in the estimation of cross-sample contamination.

  For each site in a VCF of common biallelic SNPs with population allele
  frequencies (for example a gnomAD-derived resource), counts the reads
  that support the reference allele, the alternate allele and any other
  allele. The output pileup summary table is used as input to
  `gatk4 CalculateContamination`.
keywords: [variant calling, somatic, GATK, GATK4, Mutect2, contamination, pileup]
links:
  homepage: https://gatk.broadinstitute.org
  documentation: https://gatk.broadinstitute.org/hc/en-us
  repository: https://github.com/broadinstitute/gatk
references:
  bibtex:
    - |
      @book{VanderAuwera2020,
        author = {{Van der Auwera}, Geraldine A. and O'Connor, Brian D.},
        title = {Genomics in the Cloud: Using Docker, GATK, and WDL in Terra},
        edition = {1st},
        publisher = {O'Reilly Media},
        year = {2020},
        isbn = {9781491975190}
      }
license: Apache-2.0
requirements:
  commands: [gatk]
authors:
  - __merge__: /src/_authors/luke_zappia.yaml
    roles: [author, maintainer]

argument_groups:
  - name: "Input"
    arguments:
      - name: "--input"
        alternatives: [-I]
        type: file
        description: |
          Input BAM or CRAM file containing the reads to summarize.

          The file must be coordinate-sorted and indexed (see `--read_index`).
          A CRAM file requires `--reference`.
        required: true
        example: sample.bam
      - name: "--read_index"
        type: file
        description: |
          Index file for `--input` (`.bai` for BAM, `.crai` or `.bai` for CRAM).
        required: true
        example: sample.bam.bai
      - name: "--variant"
        alternatives: [-V]
        type: file
        description: |
          VCF file of common biallelic SNPs with population allele
          frequencies in the `AF` INFO field.
        required: true
        example: common_snps.vcf.gz
      - name: "--variant_index"
        type: file
        description: |
          Index file for `--variant` (`.tbi` for a `.vcf.gz` file, `.idx`
          for a `.vcf` file).

          If not provided, a copy of `--variant` is indexed before the run.
        example: common_snps.vcf.gz.tbi
      - name: "--reference"
        alternatives: [-R]
        type: file
        description: |
          Reference sequence FASTA file.

          Required if `--input` is a CRAM file. If provided,
          `--reference_fai` and `--reference_dict` must be provided too.
        example: reference.fasta
      - name: "--reference_fai"
        type: file
        description: FASTA index file (`.fai`) for the reference sequence.
        example: reference.fasta.fai
      - name: "--reference_dict"
        type: file
        description: Sequence dictionary (`.dict`) file for the reference sequence.
        example: reference.dict

  - name: "Output"
    arguments:
      - name: "--output"
        alternatives: [-O]
        type: file
        direction: output
        description: |
          Output pileup summary table, used as input to
          `gatk4 CalculateContamination`.
        required: true
        example: pileups.table

  - name: "Options"
    arguments:
      - name: "--max_depth_per_sample"
        type: integer
        description: |
          Maximum number of reads to retain per sample per locus. Reads
          above this threshold are downsampled. Set to `0` to disable.
          Default: 0.
      - name: "--maximum_population_allele_frequency"
        alternatives: [-max-af]
        type: double
        description: |
          Maximum population allele frequency of the sites to consider.
          Default: 0.2.
      - name: "--minimum_mapping_quality"
        type: integer
        description: |
          Minimum mapping quality (inclusive) of the reads to keep, used by
          the tool-default mapping quality read filter. Default: 50.
      - name: "--minimum_population_allele_frequency"
        alternatives: [-min-af]
        type: double
        description: |
          Minimum population allele frequency of the sites to consider. A
          low value increases accuracy at the expense of speed.
          Default: 0.01.

  - __merge__: /src/gatk4/utils/interval_argument_group.yaml
    description: |
      At least one interval (`--intervals` or `--interval_strings`) is
      required.

      To summarize all the sites in `--variant`, give the same VCF file to
      `--intervals`. To summarize only the sites in a set of targets, give
      a target BED file and the `--variant` VCF to `--intervals` and use
      `--interval_set_rule INTERSECTION`.

__merge__: /src/gatk4/utils/common_argument_groups.yaml

resources:
  - type: bash_script
    path: script.sh
  - path: /src/gatk4/utils/script_helpers.sh
    dest: gatk4/script_helpers.sh

test_resources:
  - type: bash_script
    path: test.sh
  - path: /src/_utils/test_helpers.sh
  - path: /src/gatk4/utils/test_helpers.sh
    dest: gatk4/test_helpers.sh

engines:
  - __merge__: /src/gatk4/utils/common_engines.yaml

runners:
  - type: executable
  - type: nextflow
