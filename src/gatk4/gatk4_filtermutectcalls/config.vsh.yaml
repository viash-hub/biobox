name: gatk4_filtermutectcalls
description: |
  Filters the raw somatic calls of `gatk4 Mutect2`.

  FilterMutectCalls calculates the probability that each call is a
  somatic variant, using the stats file of Mutect2 and (optionally) the
  contamination and tumor segmentation tables of
  `gatk4 CalculateContamination` and the read orientation model of
  `gatk4 LearnReadOrientationModel`. It then fills the FILTER column of
  the output VCF with `PASS` or the names of the filters that the call
  failed, and writes a filtering stats file.
keywords: [variant calling, somatic, GATK, GATK4, Mutect2, variant filtering]
references:
  doi:
    - 10.1101/861054

argument_groups:
  - name: "Input"
    arguments:
      - name: "--variant"
        alternatives: [-V]
        type: file
        description: |
          Raw, unfiltered VCF file from `gatk4 Mutect2`.
        required: true
        example: unfiltered.vcf.gz
      - name: "--variant_index"
        type: file
        description: |
          Index file for `--variant` (`.tbi` for a `.vcf.gz` file, `.idx`
          for a `.vcf` file).

          If not provided, a copy of a bgzipped `--variant` file is indexed before
          the run. A plain `.vcf` file does not need an index, unless an
          interval argument (for example `--intervals`) is given.
        example: unfiltered.vcf.gz.tbi
      - __merge__: /src/gatk4/utils/arguments/reference.yaml
        required: true
      - __merge__: /src/gatk4/utils/arguments/reference_fai.yaml
        required: true
      - __merge__: /src/gatk4/utils/arguments/reference_dict.yaml
        required: true
      - name: "--stats"
        type: file
        description: |
          Stats file of the Mutect2 run that made `--variant`.
        required: true
        example: unfiltered.vcf.gz.stats
      - name: "--contamination_table"
        type: file
        multiple: true
        description: |
          One or more contamination tables from
          `gatk4 CalculateContamination`, one for each tumor sample.
        example: [contamination.table]
      - name: "--tumor_segmentation"
        type: file
        multiple: true
        description: |
          One or more tumor segmentation tables (minor allele fractions of
          germline heterozygous sites) from
          `gatk4 CalculateContamination`, one for each tumor sample.
        example: [segmentation.table]
      - name: "--orientation_bias_artifact_priors"
        alternatives: [-ob-priors]
        type: file
        multiple: true
        description: |
          One or more `.tar.gz` files with the prior artifact probabilities
          for the read orientation filter, from
          `gatk4 LearnReadOrientationModel`, one table for each tumor
          sample.
        example: [read_orientation_model.tar.gz]

  - name: "Output"
    arguments:
      - name: "--output"
        alternatives: [-O]
        type: file
        direction: output
        description: |
          Output VCF file with the filtered somatic calls.
        required: true
        example: filtered.vcf.gz
      - __merge__: /src/gatk4/utils/arguments/vcf_output_index.yaml
        example: filtered.vcf.gz.tbi
      - name: "--filtering_stats"
        type: file
        direction: output
        description: |
          Output filtering stats file.
        required: true
        example: filtering_stats.tsv

  - name: "Options"
    arguments:
      - name: "--contamination_estimate"
        type: double
        description: |
          Estimate of the contamination fraction, used when no
          `--contamination_table` is given. Default: 0.0.
      - name: "--distance_on_haplotype"
        type: integer
        description: |
          On the second filtering pass, variants with the same PGT and PID
          tags as a filtered variant within this distance are also
          filtered. Default: 100.
      - name: "--f_score_beta"
        type: double
        description: |
          F score beta, the relative weight of recall to precision, used
          when `--threshold_strategy` is `OPTIMAL_F_SCORE`. Default: 1.0.
      - name: "--false_discovery_rate"
        type: double
        description: |
          Maximum false discovery rate allowed when `--threshold_strategy`
          is `FALSE_DISCOVERY_RATE`. Default: 0.05.
      - name: "--initial_threshold"
        type: double
        description: |
          Initial artifact probability threshold used in the first
          iteration. Default: 0.1.
      - name: "--log_artifact_prior"
        type: double
        description: |
          Initial natural log prior probability that a called site is not a
          technical artifact. Default: -2.302585092994046.
      - name: "--log_indel_prior"
        type: double
        description: |
          Initial natural log prior probability that a site has a somatic
          indel. Default: -16.11809565095832.
      - name: "--log_snv_prior"
        type: double
        description: |
          Initial natural log prior probability that a site has a somatic
          SNV. Default: -13.815510557964275.
      - name: "--long_indel_length"
        type: integer
        description: |
          Indels of this length or longer are treated specially by the
          mapping quality filter. Default: 5.
      - name: "--max_alt_allele_count"
        type: integer
        description: |
          Maximum number of alternate alleles per site. Default: 1.
      - name: "--max_events_in_haplotype"
        type: integer
        description: |
          Maximum number of non-germline events in the best haplotype of a
          variant allele. Default: 2.
      - name: "--max_events_in_region"
        type: integer
        description: |
          Maximum number of non-germline events in a single assembly
          region. All variants in the region are filtered if this is
          exceeded. Default: 3.
      - name: "--max_median_fragment_length_difference"
        type: integer
        description: |
          Maximum difference between the median alternate and reference
          fragment lengths. Default: 10000.
      - name: "--max_n_ratio"
        type: double
        description: |
          Maximum fraction of the non-reference bases in the pileup that
          are N (unknown). Default: Infinity.
      - name: "--microbial_mode"
        type: boolean_true
        description: |
          Set the filters to the microbial defaults.
      - name: "--min_allele_fraction"
        type: double
        description: |
          Minimum allele fraction required. Default: 0.0.
      - name: "--min_median_base_quality"
        type: integer
        description: |
          Minimum median base quality of the alternate reads. Default: 20.
      - name: "--min_median_mapping_quality"
        type: integer
        description: |
          Minimum median mapping quality of the alternate reads.
          Default: -1.
      - name: "--min_median_read_position"
        type: integer
        description: |
          Minimum median distance of variants from the end of the reads.
          Default: 1.
      - name: "--min_reads_per_strand"
        type: integer
        description: |
          Minimum number of alternate reads required on both the forward
          and the reverse strands. Default: 0.
      - name: "--min_slippage_length"
        type: integer
        description: |
          Minimum number of reference bases in a short tandem repeat (STR)
          to suspect polymerase slippage. Default: 8.
      - name: "--mitochondria_mode"
        type: boolean_true
        description: |
          Set the filters to the mitochondrial defaults.
      - name: "--normal_p_value_threshold"
        type: double
        description: |
          P value threshold for the normal artifact filter. Default: 0.001.
      - name: "--pcr_slippage_rate"
        type: double
        description: |
          The frequency of polymerase slippage in contexts where it is
          suspected. Default: 0.1.
      - name: "--threshold_strategy"
        type: string
        description: |
          The method to optimize the posterior probability threshold.
          Default: 'OPTIMAL_F_SCORE'.
        choices: [CONSTANT, FALSE_DISCOVERY_RATE, OPTIMAL_F_SCORE]
      - name: "--unique_alt_read_count"
        alternatives: [-unique]
        type: integer
        description: |
          Minimum number of unique (deduplicated) reads that support the
          alternate allele. Default: 0.
      - __merge__: /src/gatk4/utils/arguments/variant_output_filtering.yaml

  - __merge__: /src/gatk4/utils/engine_argument_group.yaml
  - __merge__: /src/gatk4/utils/vcf_output_argument_group.yaml
  - __merge__: /src/gatk4/utils/interval_argument_group.yaml

__merge__:
  - /src/gatk4/utils/common_metadata.yaml
  - /src/gatk4/utils/common_resources.yaml
