name: gatk4_haplotypecaller
namespace: gatk4
description: |
  Calls germline SNVs and indels via local re-assembly of haplotypes.

  The HaplotypeCaller is capable of calling SNPs and indels simultaneously
  via local de-novo assembly of haplotypes in an active region. Whenever
  the program encounters a region showing signs of variation, it discards
  the existing mapping information and completely reassembles the reads in
  that region. This allows it to be more accurate when calling regions
  that are traditionally difficult to call, for example when they contain
  different types of variants close to each other.
keywords: [variant calling, germline, GATK, GATK4, SNV, indel]
links:
  homepage: https://gatk.broadinstitute.org
  documentation: https://gatk.broadinstitute.org/hc/en-us
  repository: https://github.com/broadinstitute/gatk
references:
  doi:
    - 10.1101/201178
  bibtex:
    - |
      @book{VanderAuwera2020,
        author = {{Van der Auwera}, Geraldine A. and O'Connor, Brian D.},
        title = {Genomics in the Cloud: Using Docker, GATK, and WDL in Terra},
        edition = {1st},
        publisher = {O'Reilly Media},
        year = {2020},
        isbn = {9781491975190}
      }
license: Apache-2.0
requirements:
  commands: [gatk]
authors:
  - __merge__: /src/_authors/luke_zappia.yaml
    roles: [author, maintainer]

argument_groups:
  - name: "Input"
    arguments:
      - name: "--input"
        alternatives: [-I]
        type: file
        multiple: true
        description: |
          Input BAM or CRAM file(s) containing reads to call variants from.
          BAM and CRAM files can be mixed. Give more than one file to call
          the samples in all files together into one VCF.

          The files must be coordinate-sorted and indexed (see
          `--read_index`). A CRAM file is decoded with `--reference`.
        required: true
        example: [sample.bam]
      - name: "--read_index"
        type: file
        multiple: true
        description: |
          Index file(s) for `--input` (`.bai` for BAM, `.crai` or `.bai` for
          CRAM), one for each input file. They are matched to `--input` by
          order.
        required: true
        example: [sample.bam.bai]
      - name: "--reference"
        alternatives: [-R]
        type: file
        description: Reference sequence FASTA file.
        required: true
        example: reference.fasta
      - name: "--reference_fai"
        type: file
        description: FASTA index file (`.fai`) for the reference sequence.
        required: true
        example: reference.fasta.fai
      - name: "--reference_dict"
        type: file
        description: Sequence dictionary (`.dict`) file for the reference sequence.
        required: true
        example: reference.dict

  - name: "Output"
    arguments:
      - name: "--output"
        alternatives: [-O]
        type: file
        direction: output
        description: |
          Output file containing the called variants.

          This can be a VCF file (`.vcf`/`.vcf.gz`) or, when
          `--emit_ref_confidence` is set to `GVCF`, a GVCF file.
        required: true
        example: output.vcf
      - name: "--output_index"
        type: file
        direction: output
        description: |
          Output index file for `--output` (`.tbi` for a bgzipped
          `.vcf.gz` or `.vcf.bgz` file, `.idx` otherwise). Required when
          `--create_output_variant_index` is `true`, ignored when it is `false`.
        must_exist: false
        example: output.vcf.idx
      - name: "--create_bam_output"
        type: boolean_true
        description: |
          Write the assembled haplotypes to `--bam_output`.
      - name: "--bam_output"
        alternatives: [-bamout]
        type: file
        direction: output
        description: |
          Output BAM file with the assembled haplotypes (see
          `--bam_writer_type`). Required when `--create_bam_output` is
          `true`, ignored when it is `false`.
        must_exist: false
        example: bamout.bam
      - name: "--bam_output_index"
        type: file
        direction: output
        description: |
          Output index file (`.bai`) for `--bam_output`. Required when
          `--create_bam_output` is `true` and `--create_output_bam_index`
          is `true`, ignored otherwise.
        must_exist: false
        example: bamout.bai

  - name: "Options"
    arguments:
      - name: "--active_probability_threshold"
        type: double
        description: |
          Minimum probability for a locus to be considered active.
          Default: 0.002.
      - name: "--activeregion_alt_multiplier"
        type: double
        description: |
          Multiplier for up-weighting ALT-supporting reads during active
          region determination. Default: 1.0.
      - name: "--alleles"
        type: file
        description: |
          VCF file with the set of alleles to force-call regardless of
          evidence.
        example: alleles.vcf
      - name: "--alleles_index"
        type: file
        description: |
          Index file for `--alleles` (`.tbi` for a `.vcf.gz` file, `.idx`
          for a `.vcf` file).

          If not provided, a copy of `--alleles` is indexed before the run.
        example: alleles.vcf.idx
      - name: "--annotation"
        alternatives: [-A]
        type: string
        multiple: true
        description: |
          One or more specific annotations to add to variant calls, e.g.
          `ChromosomeCounts` or `InbreedingCoeff`.
        example: [ChromosomeCounts]
        choices:
          - AlleleFraction
          - AllelePseudoDepth
          - AS_BaseQualityRankSumTest
          - AS_FisherStrand
          - AS_InbreedingCoeff
          - AS_MappingQualityRankSumTest
          - AS_QualByDepth
          - AS_ReadPosRankSumTest
          - AS_RMSMappingQuality
          - AS_StrandBiasMutectAnnotation
          - AS_StrandOddsRatio
          - AssemblyComplexity
          - BaseQuality
          - BaseQualityHistogram
          - BaseQualityRankSumTest
          - ChromosomeCounts
          - ClippingRankSumTest
          - CountNs
          - Coverage
          - CycleSkipStatus
          - DepthPerAlleleBySample
          - DepthPerSampleHC
          - ExcessHet
          - FisherStrand
          - FragmentDepthPerAlleleBySample
          - FragmentLength
          - GcContent
          - GenotypeSummaries
          - HaplotypeFilteringAnnotation
          - HmerIndelLength
          - HmerIndelNuc
          - HmerMotifs
          - InbreedingCoeff
          - IndelClassify
          - IndelLength
          - LikelihoodRankSumTest
          - MappingQuality
          - MappingQualityRankSumTest
          - MappingQualityZero
          - OrientationBiasReadCounts
          - OriginalAlignment
          - PossibleDeNovo
          - QualByDepth
          - RawGtCount
          - ReadPosition
          - ReadPosRankSumTest
          - ReferenceBases
          - RMSMappingQuality
          - SampleList
          - StrandBiasBySample
          - StrandOddsRatio
          - TandemRepeat
          - TransmittedSingleton
          - UniqueAltReadCount
          - VariantType
      - name: "--annotation_group"
        alternatives: [-G]
        type: string
        multiple: true
        description: |
          One or more groups of annotations to apply to variant calls.

          Common values include `StandardAnnotation` and, for
          allele-specific annotations, `AS_StandardAnnotation`.
        example: [StandardAnnotation]
        choices:
          - AlleleSpecificAnnotation
          - AS_StandardAnnotation
          - GenotypeAnnotation
          - InfoFieldAnnotation
          - JumboGenotypeAnnotation
          - JumboInfoAnnotation
          - ReducibleAnnotation
          - StandardAnnotation
          - StandardFlowBasedAnnotation
          - StandardHCAnnotation
          - StandardMutectAnnotation
          - VariantAnnotation
      - name: "--annotations_to_exclude"
        alternatives: [-AX]
        type: string
        multiple: true
        description: |
          One or more specific annotations to exclude from variant calls,
          e.g. `RMSMappingQuality` or `FisherStrand`.
        example: [RMSMappingQuality]
        choices:
          - BaseQualityRankSumTest
          - ChromosomeCounts
          - Coverage
          - DepthPerAlleleBySample
          - DepthPerSampleHC
          - ExcessHet
          - FisherStrand
          - InbreedingCoeff
          - MappingQualityRankSumTest
          - QualByDepth
          - ReadPosRankSumTest
          - RMSMappingQuality
          - StrandOddsRatio
      - name: "--assembly_region_padding"
        type: integer
        description: |
          Number of additional bases of context to include around each
          assembly region. Default: 100.
      - name: "--bam_writer_type"
        type: string
        description: |
          Which haplotypes to write to `--bam_output`.
          Default: 'CALLED_HAPLOTYPES'.
        choices:
          - ALL_POSSIBLE_HAPLOTYPES
          - CALLED_HAPLOTYPES
          - NO_HAPLOTYPES
          - CALLED_HAPLOTYPES_NO_READS
      - name: "--base_quality_score_threshold"
        type: integer
        description: |
          Base qualities below this threshold will be reduced to the
          minimum (6). Default: 18.
      - name: "--contamination_fraction_per_sample_file"
        alternatives: [-contamination-file]
        type: file
        description: |
          Tab-separated file with the fraction of contamination in the
          sequencing data of each sample to aggressively remove. Each line
          is "<SampleID><TAB><Contamination>" (the contamination is a
          double), with no header.
        example: contamination.tsv
      - name: "--contamination_fraction_to_filter"
        alternatives: [-contamination]
        type: double
        description: |
          Fraction of contamination in sequencing data (for all samples)
          to aggressively remove. Default: 0.0.
      - name: "--dbsnp"
        alternatives: [-D]
        type: file
        description: |
          dbSNP VCF file used to annotate called variants with known
          variant IDs.
        example: dbsnp.vcf
      - name: "--dbsnp_index"
        type: file
        description: |
          Index file for `--dbsnp` (`.tbi` for a `.vcf.gz` file, `.idx` for
          a `.vcf` file).

          If not provided, a copy of `--dbsnp` is indexed before the run.
        example: dbsnp.vcf.idx
      - name: "--denovo_depth_threshold"
        type: integer
        description: |
          Minimum depth (DP) for all trio members to be considered for de novo
          calculation. Only valid if the `PossibleDeNovo` annotation is used.
          Default: 0.
      - name: "--denovo_parent_gq_threshold"
        type: integer
        description: |
          Minimum genotype quality for parents to be considered for de novo
          calculation (separate from the GQ threshold for the full trio). Only
          valid if the `PossibleDeNovo` annotation is used. Default: 20.
      - name: "--disable_optimizations"
        type: boolean_true
        description: |
          Don't skip calculations in assembly regions with no variants.
      - name: "--disable_tool_default_annotations"
        type: boolean_true
        description: |
          Disable all tool default annotations.
      - name: "--do_not_run_physical_phasing"
        type: boolean_true
        description: |
          Disable physical phasing.
      - name: "--dont_use_soft_clipped_bases"
        type: boolean_true
        description: |
          Do not analyze soft-clipped bases in the reads.
      - name: "--emit_ref_confidence"
        alternatives: [-ERC]
        type: string
        description: |
          Mode for emitting reference confidence scores.

          Set this to `GVCF` to generate a GVCF file suitable for joint
          genotyping of multiple samples (e.g. via
          `gatk4 GenotypeGVCFs`). Default: 'NONE'.
        choices: [NONE, BP_RESOLUTION, GVCF]
      - name: "--floor_blocks"
        type: boolean_true
        description: |
          Output the band lower bound for each GQ block regardless of the
          data it represents. Only relevant when `--emit_ref_confidence`
          is set to `GVCF`.
      - name: "--force_active"
        type: boolean_true
        description: |
          If set, all regions are marked as active, disabling the active
          region detection step.
      - name: "--force_call_filtered_alleles"
        alternatives: [-genotype-filtered-alleles]
        type: boolean_true
        description: |
          Force-call the filtered alleles in `--alleles`.
      - name: "--founder_id"
        type: string
        multiple: true
        description: |
          Samples representing the population "founders", used together
          with `--pedigree` to inform genotyping priors.
      - name: "--gvcf_gq_bands"
        alternatives: [-GQB]
        type: integer
        min: 1
        max: 100
        multiple: true
        description: |
          Exclusive upper bounds for reference confidence GQ bands (must
          be in `[1, 100]` and specified in increasing order). Only
          relevant when `--emit_ref_confidence` is set to `GVCF`.
          Default: 1 to 60 in steps of 1, then 70, 80, 90, 99.
      - name: "--heterozygosity"
        type: double
        description: |
          Expected heterozygosity value used to compute the prior
          probability of a het genotype. Default: 0.001.
      - name: "--heterozygosity_stdev"
        type: double
        description: |
          Standard deviation of heterozygosity for SNP and indel calling.
          Default: 0.01.
      - name: "--indel_heterozygosity"
        type: double
        description: |
          Heterozygosity for indel calling. Default: 0.000125.
      - name: "--kmer_size"
        type: integer
        multiple: true
        description: |
          Kmer size(s) to use in the read threading assembler. Default:
          10, 25.
      - name: "--mapping_quality_threshold_for_genotyping"
        type: integer
        description: |
          Mapping quality threshold to discount reads from the genotyper,
          after the active region detection and assembly steps but before
          genotyping. In contrast, `--minimum_mapping_quality` removes reads
          from all steps. To genotype with a different threshold, set both
          arguments. Default: 20.
      - name: "--max_alternate_alleles"
        type: integer
        description: |
          Maximum number of alternate alleles to genotype. Default: 6.
      - name: "--max_assembly_region_size"
        type: integer
        description: |
          Maximum size of an assembly region. Default: 300.
      - name: "--max_genotype_count"
        type: integer
        description: |
          Maximum number of genotypes to consider at any site. Default: 1024.
      - name: "--max_mnp_distance"
        alternatives: [-mnp-dist]
        type: integer
        description: |
          Two or more phased substitutions separated by this distance or
          less are merged into MNPs. Default: 0.
      - name: "--max_reads_per_alignment_start"
        type: integer
        description: |
          Maximum number of reads to retain per alignment start position.

          Reads above this threshold will be downsampled. Set to `0` to
          disable. Default: 50.
      - name: "--maximum_mapping_quality"
        type: integer
        description: |
          Maximum mapping quality of the reads to keep (inclusive). If not
          set, there is no maximum.
      - name: "--min_assembly_region_size"
        type: integer
        description: |
          Minimum size of an assembly region. Default: 50.
      - name: "--min_base_quality_score"
        alternatives: [-mbq]
        type: integer
        description: |
          Minimum base quality required to consider a base for calling.
          Default: 10.
      - name: "--min_pruning"
        type: integer
        description: |
          Minimum support to not prune paths in the assembly graph.
          Default: 2.
      - name: "--minimum_mapping_quality"
        type: integer
        description: |
          Minimum mapping quality required to consider a read for calling.
          Default: 20.
      - name: "--num_reference_samples_if_no_call"
        type: integer
        description: |
          Number of hom-ref genotypes to infer at sites not present in a
          `--population_callset` panel. Default: 0.
      - name: "--output_mode"
        type: string
        description: |
          Specifies which type of calls to output. Default:
          'EMIT_VARIANTS_ONLY'.
        choices: [EMIT_VARIANTS_ONLY, EMIT_ALL_CONFIDENT_SITES, EMIT_ALL_ACTIVE_SITES]
      - name: "--pcr_indel_model"
        type: string
        description: |
          The PCR indel model to use.

          Set this parameter to `NONE` to disable the PCR indel model, for
          example when using PCR-free sequencing data. Default:
          'CONSERVATIVE'.
        choices: [NONE, HOSTILE, AGGRESSIVE, CONSERVATIVE]
      - name: "--pedigree"
        alternatives: [-ped]
        type: file
        description: |
          Pedigree file for determining the population "founders" (see
          `--founder_id`).
        example: family.ped
      - name: "--ploidy_regions"
        type: file
        description: |
          Interval file with a column specifying the desired ploidy for
          genotyping models, overriding the default ploidy (and
          `--sample_ploidy`) in specific regions (e.g. sex chromosomes).
        example: ploidy_regions.bed
      - name: "--population_callset"
        alternatives: [-population]
        type: file
        description: |
          Callset (VCF) used to calculate genotype priors. Used together
          with `--num_reference_samples_if_no_call` and
          `--use_posteriors_to_calculate_qual`.
        example: population.vcf.gz
      - name: "--population_callset_index"
        type: file
        description: |
          Index file for `--population_callset` (`.tbi` for a `.vcf.gz` file,
          `.idx` for a `.vcf` file).

          If not provided, a copy of `--population_callset` is indexed
          before the run.
        example: population.vcf.gz.tbi
      - name: "--sample_name"
        alternatives: [-ALIAS]
        type: string
        description: |
          Name of a single sample to use from a multi-sample BAM file.
      - name: "--sample_ploidy"
        alternatives: [-ploidy]
        type: integer
        description: |
          Ploidy (number of chromosomes) per sample. For pooled data, set
          to (number of samples in each pool * sample ploidy). Default: 2.
      - name: "--standard_min_confidence_threshold_for_calling"
        alternatives: [-stand-call-conf, --stand_call_conf]
        type: double
        description: |
          The minimum phred-scaled confidence threshold at which variants
          should be called. Default: 30.0.
      - name: "--use_posteriors_to_calculate_qual"
        alternatives: [-gp-qual]
        type: boolean_true
        description: |
          If available, use the genotype posterior probabilities (see
          `--population_callset`) to calculate the site QUAL.

  - __merge__: /src/gatk4/utils/engine_argument_group.yaml
  - __merge__: /src/gatk4/utils/read_argument_group.yaml
  - __merge__: /src/gatk4/utils/vcf_output_argument_group.yaml
  - __merge__: /src/gatk4/utils/bam_output_argument_group.yaml
  - __merge__: /src/gatk4/utils/interval_argument_group.yaml

resources:
  - type: bash_script
    path: script.sh
  - path: /src/gatk4/utils/script_helpers.sh
    dest: gatk4/script_helpers.sh

test_resources:
  - type: bash_script
    path: test.sh
  - path: /src/_utils/test_helpers.sh
  - path: /src/gatk4/utils/test_helpers.sh
    dest: gatk4/test_helpers.sh

engines:
  - __merge__: /src/gatk4/utils/common_engines.yaml

runners:
  - type: executable
  - type: nextflow
