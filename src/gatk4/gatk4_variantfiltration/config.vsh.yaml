name: gatk4_variantfiltration
namespace: gatk4
description: |
  Filter variant calls based on INFO and/or FORMAT annotations.

  This tool is designed for hard-filtering variant calls based on certain
  criteria. Records are hard-filtered by changing the value in the FILTER field
  to something other than PASS. Filtered records will be preserved in the
  output unless their removal is requested. Site-level filters are supplied as
  one or more JEXL expressions via `--filter_expression` with a name via
  `--filter_name`.
keywords: [variant filtering, GATK, GATK4, hard filtering, VCF]
links:
  homepage: https://gatk.broadinstitute.org
  documentation: https://gatk.broadinstitute.org/hc/en-us
  repository: https://github.com/broadinstitute/gatk
references:
  bibtex:
    - |
      @book{VanderAuwera2020,
        author = {{Van der Auwera}, Geraldine A. and O'Connor, Brian D.},
        title = {Genomics in the Cloud: Using Docker, GATK, and WDL in Terra},
        edition = {1st},
        publisher = {O'Reilly Media},
        year = {2020},
        isbn = {9781491975190}
      }
license: Apache-2.0
requirements:
  commands: [gatk]
authors:
  - __merge__: /src/_authors/luke_zappia.yaml
    roles: [author, maintainer]

argument_groups:
  - name: "Input"
    arguments:
      - name: "--variant"
        alternatives: [-V]
        type: file
        description: Input VCF file containing variants to be filtered.
        required: true
        example: variants.vcf.gz
      - name: "--variant_index"
        type: file
        description: |
          Index file for `--variant` (`.tbi` for a `.vcf.gz` file, `.idx`
          for a `.vcf` file).

          If not provided, a copy of a bgzipped `--variant` file is indexed before
          the run. A plain `.vcf` file does not need an index, unless an
          interval argument (for example `--intervals`) is given.
        example: variants.vcf.gz.tbi
      - name: "--reference"
        alternatives: [-R]
        type: file
        description: |
          Reference genome FASTA file.

          Optional for `VariantFiltration` itself, but if provided,
          `--reference_fai` and `--reference_dict` must be provided too.
        example: reference.fasta
      - name: "--reference_fai"
        type: file
        description: FASTA index (`.fai`) file for the reference genome.
        example: reference.fasta.fai
      - name: "--reference_dict"
        type: file
        description: Sequence dictionary (`.dict`) file for the reference genome.
        example: reference.dict

  - name: "Output"
    arguments:
      - name: "--output"
        alternatives: [-O]
        type: file
        direction: output
        description: Output VCF file with the `FILTER` column annotated.
        required: true
        example: variants.filtered.vcf.gz
      - name: "--output_index"
        type: file
        direction: output
        description: |
          Output index file for `--output` (`.tbi` for a bgzipped
          `.vcf.gz` or `.vcf.bgz` file, `.idx` otherwise). Required when
          `--create_output_variant_index` is `true`, ignored when it is `false`.
        must_exist: false
        example: variants.filtered.vcf.gz.tbi

  - name: "Options"
    arguments:
      - name: "--apply_allele_specific_filters"
        type: boolean_true
        description: |
          Set the mask at the allele level rather than the site level.
          Not compatible with clustered-SNP filtering
          (`--cluster_size`/`--cluster_window_size`).
      - name: "--cluster_size"
        alternatives: [-cluster]
        type: integer
        description: |
          The number of SNPs which make up a cluster. Must be at least
          2. Used together with `--cluster_window_size` to enable
          clustered-SNP filtering. Requires `--variant` to support random
          access (e.g. bgzipped and tabix-indexed, or a plain VCF with an
          accompanying `.idx`). Default: 3.
      - name: "--cluster_window_size"
        alternatives: [-window]
        type: integer
        description: |
          The window size (in bases) in which to evaluate clustered
          SNPs. A value of 0 disables clustered-SNP filtering. Requires
          `--variant` to support random access (e.g. bgzipped and
          tabix-indexed, or a plain VCF with an accompanying `.idx`).
          Default: 0.
      - name: "--filter_expression"
        alternatives: [-filter]
        type: string
        multiple: true
        description: |
          One or more JEXL expressions used with INFO fields to filter,
          e.g. `"vc.isSNP() && QD < 2.0"`. Must be paired 1-to-1 with
          `--filter_name`.
        example: ["vc.isSNP() && QD < 2.0"]
      - name: "--filter_name"
        type: string
        multiple: true
        description: |
          Names for the list of site-level filters in `--filter_expression`.
          Recorded in the `FILTER` field for records that fail the corresponding
          expression.
        example: ["SNP_QD2"]
      - name: "--filter_not_in_mask"
        type: boolean_true
        description: Filter records that are NOT in the regions given by `--mask`.
      - name: "--genotype_filter_expression"
        alternatives: [-G-filter]
        type: string
        multiple: true
        description: |
          One or more expressions used with FORMAT (sample/genotype-level)
          fields to filter, distinct from the site-level hard filters
          above. Must be paired 1-to-1 with `--genotype_filter_name`.
        example: ["DP < 10"]
      - name: "--genotype_filter_name"
        alternatives: [-G-filter-name]
        type: string
        multiple: true
        description: |
          Names for the list of genotype-level filters (1-to-1 mapping
          with `--genotype_filter_expression`); recorded in the FORMAT
          `FT` field for genotypes that fail the corresponding
          expression.
        example: ["lowDP"]
      - name: "--invalidate_previous_filters"
        type: boolean_true
        description: |
          Remove previous filters applied to the VCF before applying the filters
          requested here.
      - name: "--invert_filter_expression"
        alternatives: [-invfilter]
        type: boolean_true
        description: Invert the selection criteria for `--filter_expression`.
      - name: "--invert_genotype_filter_expression"
        alternatives: [-invG-filter]
        type: boolean_true
        description: Invert the selection criteria for `--genotype_filter_expression`.
      - name: "--mask"
        type: file
        description: |
          BED/VCF file of genomic regions used to mask (flag) variants
          that fall within (or near, see `--mask_extension`) them.
        example: mask.bed
      - name: "--mask_index"
        type: file
        description: |
          Index file for `--mask` (`.tbi` for a bgzipped file such as
          `.vcf.gz`, `.idx` for a plain file such as `.vcf` or `.bed`).

          GATK needs an index for every `--mask` file, also a plain BED or
          VCF. If not provided, a copy of `--mask` is indexed before the
          run.
        example: mask.vcf.gz.tbi
      - name: "--mask_description"
        type: string
        description: Description to add to the FILTER field header line for the mask filter.
      - name: "--mask_extension"
        type: integer
        description: |
          How many bases beyond the regions in `--mask` should variants
          also be filtered. Default: 0.
      - name: "--mask_name"
        type: string
        description: |
          The text to put in the FILTER field if a variant overlaps (or
          is within `--mask_extension` of) the regions in `--mask`.
          Default: 'Mask'.
      - name: "--missing_values_evaluate_as_failing"
        type: boolean_true
        description: |
          When evaluating the JEXL filter expressions, treat missing
          INFO/FORMAT values as failing the expression rather than
          passing it.
      - name: "--set_filtered_genotype_to_no_call"
        type: boolean_true
        description: |
          Set genotypes that fail `--genotype_filter_expression` to
          no-call (`./.`) instead of leaving the original genotype call
          annotated with a FORMAT `FT` filter name.
      - name: "--variant_output_filtering"
        type: string
        choices: [STARTS_IN, ENDS_IN, OVERLAPS, CONTAINED, ANYWHERE]
        description: |
          Restrict the output variants to ones that match the
          `--intervals` according to the specified matching mode.
        example: STARTS_IN

  - __merge__: /src/gatk4/utils/engine_argument_group.yaml
  - __merge__: /src/gatk4/utils/vcf_output_argument_group.yaml
  - __merge__: /src/gatk4/utils/interval_argument_group.yaml

resources:
  - type: bash_script
    path: script.sh
  - path: /src/gatk4/utils/script_helpers.sh
    dest: gatk4/script_helpers.sh

test_resources:
  - type: bash_script
    path: test.sh
  - path: /src/_utils/test_helpers.sh
  - path: /src/gatk4/utils/test_helpers.sh
    dest: gatk4/test_helpers.sh

engines:
  - __merge__: /src/gatk4/utils/common_engines.yaml

runners:
  - type: executable
  - type: nextflow
