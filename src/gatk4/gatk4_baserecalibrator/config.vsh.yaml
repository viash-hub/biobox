name: gatk4_baserecalibrator
namespace: gatk4
description: |
  First pass of the Base Quality Score Recalibration (BQSR) process.

  Generates a recalibration table based on various user-specified
  covariates (such as read group, reported quality score, machine cycle,
  and nucleotide context), modeling systematic errors made by the
  sequencing machine that cause it to over- or under-estimate the quality
  scores assigned to each individual base call. Known sites of variation
  are used to mask out bases at sites of real (expected) variation, so
  that the model captures only errors. The resulting recalibration table
  is consumed by `gatk4 ApplyBQSR` to recalibrate the base quality scores
  in the original BAM or CRAM file.
keywords: [base quality score recalibration, BQSR, GATK, GATK4, preprocessing]
links:
  homepage: https://gatk.broadinstitute.org
  documentation: https://gatk.broadinstitute.org/hc/en-us
  repository: https://github.com/broadinstitute/gatk
references:
  doi:
    - 10.1038/ng.806
  bibtex:
    - |
      @book{VanderAuwera2020,
        author = {{Van der Auwera}, Geraldine A. and O'Connor, Brian D.},
        title = {Genomics in the Cloud: Using Docker, GATK, and WDL in Terra},
        edition = {1st},
        publisher = {O'Reilly Media},
        year = {2020},
        isbn = {9781491975190}
      }
license: Apache-2.0
requirements:
  commands: [gatk]
authors:
  - __merge__: /src/_authors/luke_zappia.yaml
    roles: [author, maintainer]

argument_groups:
  - name: "Input"
    arguments:
      - name: "--input"
        alternatives: [-I]
        type: file
        multiple: true
        description: |
          One or more input BAM or CRAM files containing reads to be
          recalibrated. The reads from all files are used to make one
          recalibration table, for example for a sample sequenced on
          several lanes.

          The files must be coordinate-sorted and indexed (see
          `--read_index`).
        required: true
        example: [sample.bam]
      - name: "--read_index"
        type: file
        multiple: true
        description: |
          Index files for `--input` (`.bai` for a BAM file, `.crai` or `.bai`
          for a CRAM file).

          The index files are matched to `--input` by order. One index file
          must be given for each `--input` file.
        required: true
        example: [sample.bam.bai]
      - name: "--reference"
        alternatives: [-R]
        type: file
        description: Reference sequence FASTA file.
        required: true
        example: reference.fasta
      - name: "--reference_fai"
        type: file
        description: FASTA index file (`.fai`) for the reference sequence.
        required: true
        example: reference.fasta.fai
      - name: "--reference_dict"
        type: file
        description: Sequence dictionary (`.dict`) file for the reference sequence.
        required: true
        example: reference.dict
      - name: "--known_sites"
        type: file
        multiple: true
        required: true
        description: |
          One or more databases of known polymorphic sites (e.g. dbSNP,
          Mills and 1000G gold standard indels) used to exclude regions
          around known polymorphisms from the recalibration analysis.

          At least one known-sites VCF file must be provided.
        example: [dbsnp.vcf, mills_indels.vcf]
      - name: "--known_sites_index"
        type: file
        multiple: true
        description: |
          Index files for `--known_sites` (`.tbi` for a `.vcf.gz` file,
          `.idx` for a `.vcf` file).

          The index files are matched to `--known_sites` by order. If index
          files are provided, one must be given for each `--known_sites`
          file.

          If not provided, a copy of each `--known_sites` file is indexed
          before the run.
        example: [dbsnp.vcf.idx, mills_indels.vcf.idx]

  - name: "Output"
    arguments:
      - name: "--output"
        alternatives: [-O]
        type: file
        direction: output
        description: |
          Output recalibration table file (GATKReport format) to be used
          as input to `gatk4 ApplyBQSR`.
        required: true
        example: recal_data.table

  - name: "Options"
    arguments:
      - name: "--binary_tag_name"
        type: string
        description: The binary tag covariate name if using it.
      - name: "--bqsr_baq_gap_open_penalty"
        type: double
        description: |
          BQSR BAQ gap open penalty (Phred scaled). Default: 40. `30` is
          perhaps better for whole genome call sets.
      - name: "--default_base_qualities"
        type: integer
        description: |
          Assign a default base quality to use in place of read qualities that
          are missing or invalid. Default: -1.
      - name: "--deletions_default_quality"
        type: integer
        description: |
          Default quality for the base deletions covariate. Default: 45.
      - name: "--indels_context_size"
        alternatives: [-ics]
        type: integer
        description: |
          Size of the k-mer context to be used for base insertions and
          deletions. Default: 3.
      - name: "--insertions_default_quality"
        type: integer
        description: |
          Default quality for the base insertions covariate. Default: 45.
      - name: "--low_quality_tail"
        type: integer
        description: |
          Minimum quality for the bases in the tail of the reads to be
          considered. Default: 2.
      - name: "--maximum_cycle_value"
        alternatives: [-max-cycle]
        type: integer
        description: |
          The maximum cycle value permitted for the Cycle covariate.
          Default: 500.
      - name: "--mismatches_context_size"
        alternatives: [-mcs]
        type: integer
        description: |
          Size of the k-mer context to be used for base mismatches.
          Default: 2.
      - name: "--mismatches_default_quality"
        type: integer
        description: |
          Default quality for the base mismatches covariate. Default: -1.
      - name: "--preserve_qscores_less_than"
        type: integer
        description: |
          Don't recalibrate bases with quality scores less than this
          threshold. Default: 6.
      - name: "--quantizing_levels"
        type: integer
        description: |
          Number of distinct quality scores in the quantized output.
          Default: 16.
      - name: "--use_original_qualities"
        alternatives: [-OQ]
        type: boolean_true
        description: Use the base quality scores from the `OQ` tag instead of the current ones.

  - __merge__: /src/gatk4/utils/engine_argument_group.yaml
  - __merge__: /src/gatk4/utils/read_argument_group.yaml
  - __merge__: /src/gatk4/utils/interval_argument_group.yaml

resources:
  - type: bash_script
    path: script.sh
  - path: /src/gatk4/utils/script_helpers.sh
    dest: gatk4/script_helpers.sh

test_resources:
  - type: bash_script
    path: test.sh
  - path: /src/_utils/test_helpers.sh
  - path: /src/gatk4/utils/test_helpers.sh
    dest: gatk4/test_helpers.sh

# Docker engine setup shared identically across the whole gatk4 family.
engines:
  - __merge__: /src/gatk4/utils/common_engines.yaml

runners:
  - type: executable
  - type: nextflow
