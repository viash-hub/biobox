name: gatk4_genotypegvcfs
description: |
  Perform joint genotyping on one or more samples previously called with
  HaplotypeCaller in GVCF mode.

  GenotypeGVCFs merges the records in the input GVCF(s) and performs joint
  genotyping to produce a set of final, genotyped calls in a VCF file. The
  input can be a single-sample GVCF (e.g. from `gatk4 HaplotypeCaller` run
  with `--emit_ref_confidence GVCF`), a combined multi-sample GVCF (e.g.
  from `gatk4 CombineGVCFs`), or a GenomicsDB workspace produced by
  `gatk4 GenomicsDBImport`.
keywords: [variant calling, germline, joint genotyping, GATK, GATK4, VCF, GVCF]
references:
  doi:
    - 10.1101/201178

argument_groups:
  - name: "Input"
    arguments:
      - name: "--variant"
        alternatives: [-V]
        type: file
        description: |
          Input variants to joint-genotype.

          This can be one of:
          - A single-sample GVCF produced by `gatk4 HaplotypeCaller` run
            with `--emit_ref_confidence GVCF`
          - A combined multi-sample GVCF produced by `gatk4 CombineGVCFs`
          - A GenomicsDB workspace directory produced by
            `gatk4 GenomicsDBImport`

          When a directory is provided, it is assumed to be a GenomicsDB
          workspace and is automatically referenced with the required
          `gendb://` prefix.
        required: true
        example: sample.g.vcf.gz
      - name: "--variant_index"
        type: file
        description: |
          Index file for `--variant` (`.tbi` for a `.vcf.gz` file, `.idx` for
          a `.vcf` file). Cannot be used with a GenomicsDB workspace
          directory.

          If not provided, a copy of a bgzipped `--variant` file is indexed before
          the run. A plain `.vcf` file does not need an index, unless an
          interval argument (for example `--intervals`) is given.
        example: sample.g.vcf.gz.tbi
      - __merge__: /src/gatk4/utils/arguments/reference.yaml
        required: true
      - __merge__: /src/gatk4/utils/arguments/reference_fai.yaml
        required: true
      - __merge__: /src/gatk4/utils/arguments/reference_dict.yaml
        required: true

  - name: "Output"
    arguments:
      - name: "--output"
        alternatives: [-O]
        type: file
        direction: output
        description: |
          Output file containing the final, genotyped variants in VCF
          format (`.vcf`/`.vcf.gz`).
        required: true
        example: output.vcf
      - __merge__: /src/gatk4/utils/arguments/vcf_output_index.yaml
        example: output.vcf.idx

  - name: "Options"
    arguments:
      - name: "--allele_fraction_error"
        type: double
        description: |
          Margin of error in allele fraction to consider a somatic variant
          homoplasmic. Only relevant when `--input_is_somatic` is set.
          Default: 0.001.
      - name: "--allow_old_rms_mapping_quality_annotation_data"
        type: boolean_true
        description: |
          Override to allow old `RMSMappingQuality` annotated VCFs to function.
          Only valid if the `RMSMappingQuality` annotation is used.
      - name: "--annotate_with_num_discovered_alleles"
        type: boolean_true
        description: |
          Annotate records with the number of alternate alleles that were
          discovered (but not necessarily genotyped) at a given site.
      - name: "--call_genotypes"
        type: boolean_true
        description: |
          Output called genotypes in the final VCF (otherwise no-call).
      - name: "--dbsnp"
        alternatives: [-D]
        type: file
        description: |
          dbSNP VCF file used to annotate called variants with known
          variant IDs.
        example: dbsnp.vcf.gz
      - name: "--dbsnp_index"
        type: file
        description: |
          Index file for `--dbsnp` (`.tbi` for a `.vcf.gz` file, `.idx` for a
          `.vcf` file).

          If not provided, a copy of `--dbsnp` is indexed before the run.
        example: dbsnp.vcf.gz.tbi
      - name: "--denovo_depth_threshold"
        type: integer
        description: |
          Minimum depth (DP) for all trio members to be considered for de novo
          calculation. Only valid if the `PossibleDeNovo` annotation is used.
          Default: 0.
      - name: "--denovo_parent_gq_threshold"
        type: integer
        description: |
          Minimum genotype quality for parents to be considered for de novo
          calculation (separate from the GQ threshold for the full trio). Only
          valid if the `PossibleDeNovo` annotation is used. Default: 20.
      - name: "--force_output_intervals"
        type: file
        multiple: true
        description: |
          Sites at which to output genotypes even if non-variant in all
          samples, provided as a file (e.g. BED, interval_list). Can be
          specified multiple times.

          Can be combined with `--force_output_interval_strings`.
        example: [force_call_sites.bed]
      - name: "--force_output_interval_strings"
        type: string
        multiple: true
        description: |
          Sites at which to output genotypes even if non-variant in all
          samples, provided as interval strings (e.g. `chr1:100-200`). Can be
          specified multiple times.

          Can be combined with `--force_output_intervals`.
        example: ["chr1:100-200"]
      - name: "--founder_id"
        type: string
        multiple: true
        description: |
          Samples representing the population "founders", used (together
          with `--pedigree`) by pedigree-aware genotype assignment (see
          `--genotype_assignment_method`).
        example: [sample1]
      - name: "--genomicsdb_max_alternate_alleles"
        type: integer
        description: |
          Maximum number of alternate alleles that will be combined when
          reading variants from a GenomicsDB workspace. Default: 50.
      - name: "--genomicsdb_shared_posixfs_optimizations"
        type: boolean_true
        description: |
          Allow optimizations to improve the usability and performance of
          reading a GenomicsDB workspace on shared POSIX filesystems (e.g.
          NFS, Lustre). Disables file-level locking and minimizes file
          system writes.
      - name: "--genomicsdb_use_bcf_codec"
        type: boolean_true
        description: |
          Use BCF codec streaming for data read from a GenomicsDB
          workspace instead of the default VCF codec. Performs slightly
          better, but does not support 64-bit positions or very large
          `INFO` field sizes.
      - name: "--genotype_assignment_method"
        alternatives: [-gam]
        type: string
        description: |
          How genotypes are assigned in the final VCF. Default:
          'USE_PLS_TO_ASSIGN'.
        choices:
          - SET_TO_NO_CALL
          - USE_PLS_TO_ASSIGN
          - USE_POSTERIORS_ANNOTATION
          - SET_TO_NO_CALL_NO_ANNOTATIONS
          - BEST_MATCH_TO_ORIGINAL
          - DO_NOT_ASSIGN_GENOTYPES
          - USE_POSTERIOR_PROBABILITIES
          - PREFER_PLS
      - name: "--heterozygosity"
        type: double
        description: |
          Heterozygosity value used to compute prior probabilities for any
          locus.

          See the [GATK docs](https://gatk.broadinstitute.org/hc/en-us) for full
          details on the meaning of this population genetics concept.
          Default: 0.001.
      - name: "--heterozygosity_stdev"
        type: double
        description: |
          Standard deviation of heterozygosity for SNP and indel calling.
          Default: 0.01.
      - name: "--include_non_variant_sites"
        alternatives: [-all-sites]
        type: boolean_true
        description: |
          Include loci found to be non-variant after genotyping in the
          output.
      - name: "--indel_heterozygosity"
        type: double
        description: |
          Heterozygosity for indel calling.

          See the [GATK docs](https://gatk.broadinstitute.org/hc/en-us) for full
          details on the meaning of this population genetics concept.
          Default: 0.000125.
      - name: "--input_is_somatic"
        type: boolean_true
        description: |
          Finalize the input GVCF according to somatic (i.e. Mutect2)
          TLODs (BETA feature).
      - name: "--keep_combined_raw_annotations"
        alternatives: [-keep-combined]
        type: boolean_true
        description: |
          Keep the combined raw annotations. Cannot be used together with
          `--keep_specific_combined_raw_annotation`.
      - name: "--keep_specific_combined_raw_annotation"
        alternatives: [-keep-specific-combined]
        type: string
        multiple: true
        description: |
          Keep only the specific combined raw annotations specified
          (removing the other raw annotations). Cannot be used together
          with `--keep_combined_raw_annotations`.
        example: [AS_RAW_ReadPosRankSum]
      - name: "--max_alternate_alleles"
        type: integer
        description: |
          Maximum number of alternate alleles to genotype. Default: 6.
      - name: "--max_genotype_count"
        type: integer
        description: |
          Maximum number of genotypes to consider at any site. Default: 1024.
      - name: "--merge_input_intervals"
        type: boolean_true
        description: |
          Import all data in between intervals rather than only the
          intervals themselves.
      - name: "--num_reference_samples_if_no_call"
        type: integer
        description: |
          Number of hom-ref genotypes to infer at sites not present in a
          `--population_callset` panel. Default: 0.
      - name: "--pedigree"
        alternatives: [-ped]
        type: file
        description: |
          Pedigree file for determining the population "founders" (see
          `--founder_id`).
        example: pedigree.ped
      - name: "--population_callset"
        alternatives: [-population]
        type: file
        description: |
          Callset (VCF) used to calculate genotype priors. Used together
          with `--num_reference_samples_if_no_call` and
          `--use_posteriors_to_calculate_qual`.
        example: population.vcf.gz
      - name: "--population_callset_index"
        type: file
        description: |
          Index file for `--population_callset` (`.tbi` for a `.vcf.gz` file,
          `.idx` for a `.vcf` file).

          If not provided, a copy of a bgzipped `--population_callset` file is
          indexed before the run. A plain `.vcf` file does not need an index.
        example: population.vcf.gz.tbi
      - name: "--sample_ploidy"
        alternatives: [-ploidy]
        type: integer
        description: |
          Ploidy (number of chromosomes) per sample.

          For pooled data, set to (number of samples in each pool * sample
          ploidy). Default: 2.
      - name: "--somatic_quality_threshold"
        type: double
        description: |
          SQ (somatic quality) threshold to emit a variant to the VCF.
          Only relevant when `--input_is_somatic` is set. Default: 3.0.
      - name: "--standard_min_confidence_threshold_for_calling"
        alternatives: [-stand-call-conf, --stand_call_conf]
        type: double
        description: |
          The minimum phred-scaled confidence threshold at which variants
          should be called. Default: 30.0.
      - name: "--tumor_lod_to_emit"
        alternatives: [-emit-lod]
        type: double
        description: |
          LOD threshold to emit a variant to the VCF. Only relevant when
          `--input_is_somatic` is set. Default: 3.5.
      - name: "--use_posteriors_to_calculate_qual"
        alternatives: [-gp-qual]
        type: boolean_true
        description: |
          If available, use the genotype posterior probabilities (see
          `--population_callset`) to calculate the site QUAL.
      - __merge__: /src/gatk4/utils/arguments/variant_output_filtering.yaml
  - __merge__: /src/gatk4/utils/annotation_argument_group.yaml
    arguments:
      - name: "--annotations_to_exclude"
        alternatives: [-AX]
        type: string
        multiple: true
        description: |
          One or more specific annotations to exclude from variant calls,
          e.g. `RMSMappingQuality` or `FisherStrand`.
        example: [RMSMappingQuality]
        choices:
          - BaseQualityRankSumTest
          - ChromosomeCounts
          - Coverage
          - DepthPerAlleleBySample
          - ExcessHet
          - FisherStrand
          - InbreedingCoeff
          - MappingQualityRankSumTest
          - QualByDepth
          - ReadPosRankSumTest
          - RMSMappingQuality
          - StrandOddsRatio
      - name: "--disable_tool_default_annotations"
        type: boolean_true
        description: |
          Disable all tool default annotations.
      - name: "--enable_all_annotations"
        type: boolean_true
        description: |
          Use all possible annotations (not for the faint of heart).
  - __merge__: /src/gatk4/utils/engine_argument_group.yaml
  - __merge__: /src/gatk4/utils/vcf_output_argument_group.yaml
  - __merge__: /src/gatk4/utils/interval_argument_group.yaml

__merge__:
  - /src/gatk4/utils/common_metadata.yaml
  - /src/gatk4/utils/common_resources.yaml
