name: gatk4_combinegvcfs
description: |
  Merges multiple per-sample GVCF files (produced by `gatk4 HaplotypeCaller`
  in `--emit_ref_confidence GVCF` mode) into a single multi-sample GVCF with
  appropriate annotations.

  The resulting combined GVCF is not genotyped, it is intended to be used
  as input to `gatk4 GenotypeGVCFs` to jointly call genotypes across all
  merged samples.
keywords: [variant calling, germline, GATK, GATK4, GVCF, joint genotyping]
references:
  doi:
    - 10.1101/201178

argument_groups:
  - name: "Input"
    arguments:
      - name: "--variant"
        alternatives: [-V]
        type: file
        multiple: true
        description: |
          Per-sample GVCF file(s) to combine (as produced by
          `gatk4 HaplotypeCaller` in `--emit_ref_confidence GVCF` mode).

          Specify this argument once per input GVCF file.
        required: true
        example: [sample1.g.vcf.gz, sample2.g.vcf.gz]
      - name: "--variant_index"
        type: file
        multiple: true
        description: |
          Index files for `--variant` (`.tbi` for a `.vcf.gz` file, `.idx`
          for a `.vcf` file).

          The index files are matched to `--variant` by order. If index files
          are provided, one must be given for each `--variant` file.

          If not provided, a copy of each bgzipped `--variant` file is indexed
          before the run. A plain `.vcf` file does not need an index, unless
          an interval argument (for example `--intervals`) is given.
        example: [sample1.g.vcf.gz.tbi]
      - __merge__: /src/gatk4/utils/arguments/reference.yaml
        required: true
      - __merge__: /src/gatk4/utils/arguments/reference_fai.yaml
        required: true
      - __merge__: /src/gatk4/utils/arguments/reference_dict.yaml
        required: true

  - name: "Output"
    arguments:
      - name: "--output"
        alternatives: [-O]
        type: file
        direction: output
        description: |
          The combined multi-sample GVCF output file.
        required: true
        example: combined.g.vcf
      - __merge__: /src/gatk4/utils/arguments/vcf_output_index.yaml
        example: combined.g.vcf.idx

  - name: "Options"
    arguments:
      - name: "--allow_old_rms_mapping_quality_annotation_data"
        type: boolean_true
        description: |
          Override to allow old `RMSMappingQuality` annotated VCFs to function.
          Only valid if the `RMSMappingQuality` annotation is used.
      - name: "--break_bands_at_multiples_of"
        type: integer
        description: |
          If greater than `0`, reference bands will be broken up at genomic
          positions that are multiples of this number. Default: 0.
      - name: "--call_genotypes"
        type: boolean_true
        description: |
          Output called genotypes.
      - name: "--combine_variants_distance"
        type: integer
        description: |
          Maximum distance (in bp) for variants to be grouped together
          when combining. Default: 0.
      - name: "--convert_to_base_pair_resolution"
        type: boolean_true
        description: |
          If specified, convert banded GVCFs to all-sites GVCFs.
      - name: "--dbsnp"
        alternatives: [-D]
        type: file
        description: |
          dbSNP VCF file used to annotate the combined GVCF with known
          variant IDs.
        example: dbsnp.vcf.gz
      - name: "--dbsnp_index"
        type: file
        description: |
          Index file for `--dbsnp` (`.tbi` for a `.vcf.gz` file, `.idx` for a
          `.vcf` file).

          If not provided, a copy of a bgzipped `--dbsnp` file is indexed before
          the run. A plain `.vcf` file does not need an index.
        example: dbsnp.vcf.gz.tbi
      - name: "--denovo_depth_threshold"
        type: integer
        description: |
          Minimum depth (DP) for all trio members to be considered for de novo
          calculation. Only valid if the `PossibleDeNovo` annotation is used.
          Default: 0.
      - name: "--denovo_parent_gq_threshold"
        type: integer
        description: |
          Minimum genotype quality for parents to be considered for de novo
          calculation (separate from the GQ threshold for the full trio). Only
          valid if the `PossibleDeNovo` annotation is used. Default: 20.
      - name: "--drop_somatic_filtering_annotations"
        type: boolean_true
        description: |
          For input somatic GVCFs (i.e. from Mutect2), drop filtering
          annotations.
      - name: "--founder_id"
        type: string
        multiple: true
        description: |
          Samples representing the population "founders", used (together
          with `--pedigree`) by pedigree-aware annotations.
        example: [sample1]
      - name: "--ignore_variants_starting_outside_interval"
        type: boolean_true
        description: |
          Restrict variant output to sites that start within the provided
          `--intervals` (only applies when an interval is specified). GVCF
          blocks that start before an interval are not written, even when they
          overlap it.
      - name: "--input_is_somatic"
        type: boolean_true
        description: |
          Merge input GVCFs according to somatic (i.e. Mutect2) annotations
          (BETA).
      - name: "--max_distance"
        type: integer
        description: |
          Maximum distance (in bp) for variants to be grouped together. Used
          together with `--combine_variants_distance`. Default: 2147483647.
      - name: "--pedigree"
        alternatives: [-ped]
        type: file
        description: |
          Pedigree file for determining the population "founders".
        example: pedigree.ped
      - name: "--ref_padding"
        type: integer
        description: |
          Number of bases on either side to expand the spanning reference
          window. Default: 1.
      - __merge__: /src/gatk4/utils/arguments/variant_output_filtering.yaml
  - __merge__: /src/gatk4/utils/annotation_argument_group.yaml
    arguments:
      - name: "--annotations_to_exclude"
        alternatives: [-AX]
        type: string
        multiple: true
        description: |
          One or more specific annotations to exclude from variant calls.
        example: [RMSMappingQuality]
        choices:
          - BaseQualityRankSumTest
          - ChromosomeCounts
          - Coverage
          - DepthPerAlleleBySample
          - ExcessHet
          - FisherStrand
          - InbreedingCoeff
          - MappingQualityRankSumTest
          - QualByDepth
          - ReadPosRankSumTest
          - RMSMappingQuality
          - StrandOddsRatio
      - name: "--disable_tool_default_annotations"
        type: boolean_true
        description: |
          Disable all tool default annotations.
      - name: "--enable_all_annotations"
        type: boolean_true
        description: |
          Use all possible annotations (not for the faint of heart).
  - __merge__: /src/gatk4/utils/engine_argument_group.yaml
  - __merge__: /src/gatk4/utils/vcf_output_argument_group.yaml
  - __merge__: /src/gatk4/utils/interval_argument_group.yaml
    description: |
      CombineGVCFs only writes a GVCF block that ends inside an interval. A
      block that starts before an interval and ends after it is not written,
      and GATK warns that the interval "cuts in the middle of one or more gVCF
      blocks". With `--convert_to_base_pair_resolution`, the first record of
      each interval has the position and reference base of the part of the
      block before the interval, and the interval start position is missing.

      To limit the records of a GVCF to a region, use SelectVariants. To
      genotype a region, give the intervals to GenotypeGVCFs.

__merge__:
  - /src/gatk4/utils/common_metadata.yaml
  - /src/gatk4/utils/common_resources.yaml
