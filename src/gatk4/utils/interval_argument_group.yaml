name: "GATK Interval Options"
arguments:
  - name: "--intervals"
    alternatives: [-L]
    type: file
    multiple: true
    description: |
      One or more genomic intervals over which to operate, provided as
      files (e.g. BED, interval_list or VCF).

      Specify this argument more than once to combine intervals (see
      `--interval_set_rule`). Can be combined with `--interval_strings`.
    example: [intervals.bed]
  - name: "--intervals_index"
    type: file
    multiple: true
    description: |
      Index files for the VCF files in `--intervals` (`.tbi` for a
      `.vcf.gz` file, `.idx` for a `.vcf` file), in the same order as
      the VCF files in `--intervals`. Other interval files do not get
      an index.

      If not provided, a copy of each bgzipped VCF `--intervals` file is
      indexed before the run. A plain `.vcf` file does not need an index.
      If provided, one index must be given for each VCF file in
      `--intervals`.
    example: [intervals.vcf.gz.tbi]
  - name: "--interval_strings"
    type: string
    multiple: true
    description: |
      One or more genomic intervals over which to operate, provided as
      strings (e.g. `chr1:100-200` or a whole contig such as `chr1`). Can be
      combined with `--intervals` files.
    example: ["chr1:100-200"]
  - name: "--exclude_intervals"
    alternatives: [-XL]
    type: file
    multiple: true
    description: |
      One or more genomic intervals to exclude from processing,
      provided as files (e.g. BED, interval_list or VCF).
    example: [exclude_intervals.bed]
  - name: "--exclude_intervals_index"
    type: file
    multiple: true
    description: |
      Index files for the VCF files in `--exclude_intervals` (`.tbi`
      for a `.vcf.gz` file, `.idx` for a `.vcf` file), in the same
      order as the VCF files in `--exclude_intervals`. Other interval
      files do not get an index.

      If not provided, a copy of each bgzipped VCF `--exclude_intervals`
      file is indexed before the run. A plain `.vcf` file does not need an
      index. If provided, one index must be given for each VCF file in
      `--exclude_intervals`.
    example: [exclude_intervals.vcf.gz.tbi]
  - name: "--exclude_interval_strings"
    type: string
    multiple: true
    description: |
      One or more genomic intervals to exclude from processing, provided as
      strings (e.g. `chr1:100-200` or a whole contig such as `chr1`). Can be
      combined with `--exclude_intervals` files.
    example: ["chr1:150-160"]
  - name: "--interval_set_rule"
    alternatives: [-isr]
    type: string
    description: |
      Set merging approach to use for combining the `--intervals` and
      `--interval_strings` inputs. Default: 'UNION'.
    choices: [UNION, INTERSECTION]
  - name: "--interval_merging_rule"
    alternatives: [-imr]
    type: string
    description: |
      Interval merging rule for abutting intervals. With `ALL`, abutting
      intervals are merged, with `OVERLAPPING_ONLY` only overlapping
      intervals are merged. Default: 'ALL'.
    choices: [ALL, OVERLAPPING_ONLY]
  - name: "--interval_padding"
    alternatives: [-ip]
    type: integer
    description: |
      Amount of padding (in bp) to add to each interval in
      `--intervals` and `--interval_strings`. Default: 0.
  - name: "--interval_exclusion_padding"
    alternatives: [-ixp]
    type: integer
    description: |
      Amount of padding (in bp) to add to each interval in
      `--exclude_intervals` and `--exclude_interval_strings`. Default: 0.
