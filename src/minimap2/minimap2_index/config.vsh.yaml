name: minimap2_index
namespace: minimap2
description: |
  Provides fasta index required by minimap2 alignment.
  Create a minimap2 index (.mmi) from a FASTA reference.
  This component uses minimap2's `-d` flag to create an index file (.mmi).
keywords: [Alignment, Indexing, Minimap2]
links:
  homepage: https://lh3.github.io/minimap2/
  documentation: https://github.com/lh3/minimap2#uguide
  repository: https://github.com/lh3/minimap2
references:
  doi:
    - 10.1093/bioinformatics/bty191
    - 10.1093/bioinformatics/btab705
license: MIT
authors:
  - __merge__: /src/_authors/marilyn_degraeve.yaml
    roles: [author, maintainer]

requirements:
  commands: [minimap2]

argument_groups:
  - name: Input
    arguments:
    - name: --input
      alternatives: -i
      type: file
      description: |
        Reference database file in FASTA format.
      required: true
      example: reference.fasta

  - name: Output
    arguments:
      - name: --output
        alternatives: -o
        type: file
        direction: output
        description: |
          Output Minimap2 index in .mmi format.
        required: true
        example: reference.mmi

  - name: Arguments
    arguments:
      - name: --preset
        alternatives: -x
        type: string
        description: |
          Preset to build the index for (e.g. map-ont, map-hifi, map-pb, lr:hq,
          asm5, asm10, asm20, splice, sr, ava-ont, ava-pb). Run `minimap2 -x`
          for the full list.

          A preset selects the indexing parameters `-k`, `-w` and `-H` (for
          example `map-hifi` and `asm5` use `k=19, w=19`, while the default is
          `k=15, w=10`). Those parameters are baked into the `.mmi` file and
          **cannot** be changed later: when `minimap2_align` is given a
          pre-built index it keeps the parameters the index was built with and
          warns `Indexing parameters (-k, -w or -H) overridden by parameters
          used in the prebuilt index`.

          Pass the same `--preset` here that will be used for alignment, so the
          index matches the intended sequencing technology.
        example: map-ont

      - name: --kmer_size
        alternatives: -k
        type: integer
        description: |
          K-mer size, overriding the value implied by `--preset`. Passed to
          minimap2 `-k`. Maximum 28.
        min: 1
        max: 28
        example: 15

      - name: --window_size
        alternatives: -w
        type: integer
        description: |
          Minimizer window size, overriding the value implied by `--preset`.
          Passed to minimap2 `-w`. Maximum 255.
        min: 1
        max: 255
        example: 10

      - name: --homopolymer_compressed
        alternatives: -H
        type: boolean_true
        description: |
          Use homopolymer-compressed k-mers, as recommended for PacBio CLR
          reads. Passed to minimap2 `-H`.

resources:
  - type: bash_script
    path: script.sh

test_resources:
  - type: bash_script
    path: test.sh
  - path: /src/_utils/test_helpers.sh

engines:
  - type: docker
    image: quay.io/biocontainers/minimap2:2.30--h577a1d6_0
    setup:
      - type: docker
        run: |
          minimap2 --version | head -1 | sed 's/^/minimap2: /' > /var/software_versions.txt

runners:
  - type: executable
  - type: nextflow
