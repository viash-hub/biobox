name: minimap2_align
namespace: minimap2
description: |
  A versatile pairwise aligner for genomic and spliced nucleotide sequences.
  This component maps DNA or mRNA query sequences against a reference database (FASTA or .mmi index).
  By default, it outputs mapping coordinates in PAF format. If the --bam flag is provided, it outputs a sorted and indexed BAM file.
keywords: [Alignment, Mapper, Minimap2]
links:
  homepage: https://lh3.github.io/minimap2/
  documentation: https://github.com/lh3/minimap2#uguide
  repository: https://github.com/lh3/minimap2
references:
  doi: 
    - 10.1093/bioinformatics/bty191
    - 10.1093/bioinformatics/btab705
license: MIT
authors:
  - __merge__: /src/_authors/marilyn_degraeve.yaml
    roles: [author, maintainer]

requirements:
  commands: [minimap2, samtools]

argument_groups:
  - name: Input
    arguments:
      - name: --reference
        alternatives: [-i, --input]
        type: file
        description: Reference fasta or .mmi index.
        required: true
        example: reference.fasta
      - name: --query
        alternatives: [-q]
        type: file
        description: Query sequences (FASTQ/FASTA).
        required: true
        example: reads.fastq

  - name: Output
    arguments:
      - name: --bam
        type: boolean_true
        description: |
          Output a coordinate-sorted and indexed BAM file instead of PAF.

          The alignment is piped through `samtools sort` and then indexed with
          `samtools index`. Use `--output_index` to control where the index is
          written.
      - name: --cigar_paf
        type: boolean_true
        description: |
          Output CIGAR in PAF format (`-c`). Only valid without `--bam`, since
          BAM records always carry a CIGAR.
      - name: --cigar_bam
        type: boolean_true
        description: |
          Write long CIGARs (>65535 operations) in the BAM `CG` tag (`-L`).
          Only valid together with `--bam`.
      - name: --output
        alternatives: -o
        type: file
        direction: output
        description: Output alignment file in PAF (default) or BAM format.
        required: true
        example: alignment.paf
      - name: --output_index
        type: file
        direction: output
        description: |
          Path for the BAM index. Ignored without `--bam`.

          If omitted, the index is written next to `--output` as
          `<output>.bai`. Declaring it explicitly is what makes the index a
          tracked output, so it is published by the Nextflow runner instead of
          being left behind in the work directory.
        example: alignment.bam.bai

  - name: Arguments
    arguments:
      - name: --preset
        alternatives: -x
        type: string
        description: |
          Preset alignment options (e.g. map-ont, map-hifi, map-pb, lr:hq, asm5,
          asm10, asm20, splice, sr, ava-ont, ava-pb). Run `minimap2 -x` for the
          full list.

          The preset is applied before all other options, as minimap2
          recommends, so that it does not override them.

          Note that a preset also selects indexing parameters (`-k`, `-w`,
          `-H`). Those only take effect when `--reference` is a FASTA file: when
          a pre-built `.mmi` is passed, minimap2 keeps the parameters the index
          was built with and warns `Indexing parameters (-k, -w or -H)
          overridden by parameters used in the prebuilt index`. Build the index
          with the matching `--preset` in `minimap2_index` to avoid this.
        example: map-ont

resources:
  - type: bash_script
    path: script.sh

test_resources:
  - type: bash_script
    path: test.sh
  - path: /src/_utils/test_helpers.sh

engines:
  - type: docker
    image: quay.io/biocontainers/mulled-v2-66534bcbb7031a148b13e2ad42583020b9cd25c4:eb7d926a9d7da1ab8e5427cd947dbbb8795eabab-0
    setup:
    - type: docker
      run: |
          samtools --version 2>&1 | grep -E '^(samtools|Using htslib)' | \
          sed 's#Using ##;s# \([0-9\.]*\)$#: \1#' > /var/software_versions.txt && \
          minimap2 --version 2>&1 | sed 's/^/minimap2: /' >> /var/software_versions.txt

runners:
  - type: executable
  - type: nextflow
