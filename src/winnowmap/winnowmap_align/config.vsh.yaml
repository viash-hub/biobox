name: winnowmap_align
namespace: winnowmap
description: |
  Map long reads to a reference genome using Winnowmap, a long-read aligner
  optimised for repetitive regions such as centromeres and segmental duplications.

  Winnowmap extends the minimap2 framework with **weighted minimizers**, which
  down-weight frequently occurring k-mers so that mappings in repeat-rich regions
  are more accurate. K-mer frequencies are pre-computed with
  [meryl](https://github.com/marbl/meryl); if no pre-computed file is provided
  this component will run meryl automatically, in which case `--kmer_size` must
  be given (meryl has no default k, and winnowmap's `-k` has to match it).

  By default the component outputs alignments in **SAM format**. Use `--bam` to
  produce a coordinate-sorted, indexed BAM file; `samtools` is bundled in the
  engine image, so no extra setup is needed.

  Two winnowmap options are deliberately not exposed: `-a` (SAM output) is always
  passed, which makes the PAF-only `-c` meaningless, and `-d` (dump index and
  exit) is an index-building mode rather than an alignment mode.
keywords: [Alignment, Long-read, Mapping, Repetitive regions, Winnowmap]
links:
  homepage: https://github.com/marbl/Winnowmap
  documentation: https://github.com/marbl/Winnowmap#readme
  repository: https://github.com/marbl/Winnowmap
references:
  doi: 10.1038/s41592-022-01470-7
license: MIT
requirements:
  commands: [winnowmap, meryl, samtools]
authors:
  - __merge__: /src/_authors/marilyn_degraeve.yaml
    roles: [author, maintainer]

argument_groups:
  - name: Inputs
    arguments:
      - name: --reference
        type: file
        description: |
          Reference genome in FASTA format.

          Used both for k-mer frequency counting (meryl) and for read alignment (winnowmap).
        required: true
        example: reference.fasta

      - name: --query
        alternatives: [-q]
        type: file
        description: |
          Query sequences in FASTQ or FASTA format. Compressed files (`.gz`) are supported.

          **Supported formats:**
          - FASTQ (`.fastq`, `.fq`, `.fastq.gz`, `.fq.gz`)
          - FASTA (`.fasta`, `.fa`, `.fasta.gz`, `.fa.gz`)
        required: true
        example: reads.fastq.gz

      - name: --repetitive_kmers
        alternatives: [-W]
        type: file
        description: |
          Pre-computed repetitive k-mers file generated by `meryl`.

          If omitted, this component will run the following meryl commands
          automatically, and `--kmer_size` then becomes required:

          ```bash
          meryl count k=<kmer_size> output merylDB <reference>
          meryl print greater-than distinct=0.9998 merylDB > repetitive_kmers.txt
          ```

          The `distinct=0.9998` threshold (top 0.02% most frequent k-mers) is the
          one prescribed by [Winnowmap's own
          documentation](https://github.com/marbl/Winnowmap#usage).

          Providing a pre-computed file avoids repeated meryl runs when aligning
          multiple query files against the same reference.
        example: repetitive_k15.txt

  - name: Outputs
    arguments:
      - name: --bam
        type: boolean_true
        description: |
          Output a coordinate-sorted and indexed BAM file instead of SAM.

          When enabled the component pipes winnowmap output through
          `samtools sort` and then runs `samtools index` to create a `.bai`
          index. `samtools` ships in the engine image, so this needs no extra
          setup. Use `--output_index` to control where the index is written.

          The output is written as BAM regardless of the `--output` file
          extension.

      - name: --output
        alternatives: [-o]
        type: file
        direction: output
        description: |
          Path for the output alignment file.

          - SAM format (default): e.g. `alignment.sam`
          - BAM format (with `--bam`): e.g. `alignment.bam`
        required: true
        example: alignment.sam

      - name: --output_index
        type: file
        direction: output
        description: |
          Path for the BAM index. Only produced together with `--bam`; ignored
          otherwise.

          If omitted, the index is written next to `--output` as
          `<output>.bai`. Declaring it explicitly is what makes the index a
          tracked output, so it is published by the Nextflow runner instead of
          being left behind in the work directory.
        must_exist: false
        example: alignment.bam.bai

  - name: Preset
    arguments:
      - name: --preset
        alternatives: [-x]
        type: string
        description: |
          Alignment preset for the sequencing technology, passed to winnowmap `-x`.

          | Preset | Technology |
          |---|---|
          | `map-ont` | Oxford Nanopore genomic reads |
          | `map-pb` | PacBio HiFi / CCS genomic reads |
          | `map-pb-clr` | PacBio CLR genomic reads (sets `--sv-off`) |
          | `splice` | Long-read spliced alignment (sets `--sv-off`) |
          | `splice:hq` | PacBio CCS spliced alignment (sets `--sv-off`) |
          | `asm5` | Assembly-to-reference; ~0.1% divergence |
          | `asm10` | Assembly-to-reference; ~1% divergence |
          | `asm20` | Assembly-to-reference; ~5% divergence |

          Winnowmap's preset names are **not** identical to minimap2's: there is
          no `map-hifi` (HiFi reads use `map-pb`, which winnowmap's own help
          documents as "hifi-to-ref"), CLR reads use `map-pb-clr`, and there is
          no short-read `sr` preset.

          Like winnowmap itself, no preset is applied by default.

          The asm presets set their own k (19). Any option set explicitly on this
          component still wins over the preset's value for it, so `--kmer_size`
          stays in step with the `-W` k-mer list whichever preset is chosen.
        choices: [map-ont, map-pb, map-pb-clr, splice, "splice:hq", asm5, asm10, asm20]
        example: map-ont

  - name: Indexing options
    arguments:
      - name: --kmer_size
        alternatives: [-k]
        type: integer
        description: |
          K-mer size, no larger than 28. Winnowmap's own default is 15.

          **Required when `--repetitive_kmers` is not given**: the component then
          builds the k-mer list with `meryl`, which needs an explicit k, and the
          same k is passed to winnowmap's `-k`. Winnowmap refuses to run when the
          `-W` list was built with a different k than it is using
          (`input list of k-mers and winnowmap parameter k are inconsistent`).

          When passing a pre-computed `--repetitive_kmers` file, set this to the
          k that file was built with. If left unset there, winnowmap applies its
          own default k and validates the list against it.
        min: 1
        max: 28
        example: 15

      - name: --window_size
        alternatives: [-w]
        type: integer
        description: Minimizer window size. Default is 50.
        min: 1
        example: 50

      - name: --homopolymer_compressed
        alternatives: [-H]
        type: boolean_true
        description: Use homopolymer-compressed k-mers.

      - name: --split_index
        alternatives: [-I]
        type: string
        description: Split the index for every ~NUM input bases. Default is `4G`.
        example: 4G

  - name: Mapping options
    arguments:
      - name: --filter_fraction
        alternatives: [-f]
        type: double
        description: |
          Filter out the top FLOAT (<1) fraction of repetitive minimizers.
          Default is 0.0, since winnowmap down-weights repetitive minimizers via
          `-W` rather than discarding them.
        example: 0.0002

      - name: --max_chain_gap
        alternatives: [-g]
        type: integer
        description: |
          Stop chain elongation if there are no minimizers within this many bp.
          Default is 5000.
        example: 5000

      - name: --max_intron_length
        alternatives: [-G]
        type: string
        description: |
          Maximum intron length, effective with `--preset splice`; changes
          `--bandwidth`. Default is `200k`.
        example: 200k

      - name: --max_fragment_length
        alternatives: [-F]
        type: string
        description: Maximum fragment length in fragment mode. Default is `800`.
        example: "800"

      - name: --bandwidth
        alternatives: [-r]
        type: integer
        description: Bandwidth used in chaining and DP-based alignment. Default is 500.
        example: 500

      - name: --min_minimizers
        alternatives: [-n]
        type: integer
        description: Minimal number of minimizers on a chain. Default is 3.
        example: 3

      - name: --min_chaining_score
        alternatives: [-m]
        type: integer
        description: |
          Minimal chaining score, matching bases minus the log gap penalty.
          Default is 40.
        example: 40

      - name: --skip_self_dual
        alternatives: [-X]
        type: boolean_true
        description: Skip self and dual mappings, for the all-vs-all mode.

      - name: --secondary_ratio
        alternatives: [-p]
        type: double
        description: Minimal secondary-to-primary score ratio. Default is 0.8.
        example: 0.8

      - name: --sv_off
        type: boolean_true
        description: |
          Turn off SV-aware mode (`--sv-off`). Some presets set this themselves,
          see `--preset`.

  - name: Alignment options
    arguments:
      - name: --match_score
        alternatives: [-A]
        type: integer
        description: Matching score. Default is 2.
        example: 2

      - name: --mismatch_penalty
        alternatives: [-B]
        type: integer
        description: Mismatch penalty. Default is 4.
        example: 4

      - name: --gap_open_penalty
        alternatives: [-O]
        type: string
        description: |
          Gap open penalty, as `INT` or `INT,INT` for the two-piece affine gap
          cost. Default is `4,24`.
        example: "4,24"

      - name: --gap_extension_penalty
        alternatives: [-E]
        type: string
        description: |
          Gap extension penalty, as `INT` or `INT,INT`. A k-long gap costs
          `min{O1+k*E1,O2+k*E2}`. Default is `2,1`.
        example: "2,1"

      - name: --zdrop
        alternatives: [-z]
        type: string
        description: |
          Z-drop score and inversion Z-drop score, as `INT` or `INT,INT`.
          Default is `400,200`.
        example: "400,200"

      - name: --min_peak_score
        alternatives: [-s]
        type: integer
        description: Minimal peak DP alignment score. Default is 80.
        example: 80

      - name: --splice_strand
        alternatives: [-u]
        type: string
        description: |
          How to find GT-AG splice sites.

          | Value | Meaning |
          |---|---|
          | `f` | Transcript strand |
          | `b` | Both strands |
          | `n` | Do not match GT-AG (default) |
        choices: [f, b, n]
        example: n

  - name: Input/output options
    arguments:
      - name: --read_group
        alternatives: [-R]
        type: string
        description: |
          SAM read group line, in a format like `'@RG\tID:foo\tSM:bar'`.
          Required by most downstream variant callers.
        example: "@RG\tID:sample1\tSM:sample1"

      - name: --cigar_bam
        alternatives: [-L]
        type: boolean_true
        description: |
          Write CIGARs with more than 65535 operations to the `CG` tag.

          BAM's `n_cigar_op` field is 16 bit, so without this flag long reads
          spanning centromeric or segmental-duplication repeats can produce
          alignments that cannot be converted to BAM
          (`CIGAR has more than 65535 operations`).

      - name: --md_tag
        type: boolean_true
        description: Output the `MD` tag (`--MD`).

      - name: --cs_tag
        type: string
        description: |
          Output the `cs` tag in the given form (`--cs`). Not emitted by default.
        choices: [short, long]
        example: short

      - name: --eqx
        type: boolean_true
        description: Write `=`/`X` CIGAR operators instead of `M` (`--eqx`).

      - name: --soft_clipping
        alternatives: [-Y]
        type: boolean_true
        description: Use soft clipping for supplementary alignments.

      - name: --minibatch_size
        alternatives: [-K]
        type: string
        description: Minibatch size for mapping. Default is `1000M`.
        example: 1000M

resources:
  - type: bash_script
    path: script.sh

test_resources:
  - type: bash_script
    path: test.sh
  - type: file
    path: test_data
  - type: file
    path: /src/_utils/test_helpers.sh

engines:
  - type: docker
    image: quay.io/biocontainers/mulled-v2-c6777c159625854546a5d1f3a5a56b79d4096edc:e04e43313eb78752f66c61a8587de8ed271596f9-2
    setup:
      - type: docker
        run: |
          winnowmap --version 2>&1 | head -1 | sed 's/^/winnowmap: /' > /var/software_versions.txt && \
          meryl --version 2>&1 | head -1 | sed 's/^meryl /meryl: /' >> /var/software_versions.txt && \
          samtools --version 2>&1 | head -1 | sed 's/^samtools /samtools: /' >> /var/software_versions.txt

runners:
  - type: executable
  - type: nextflow
