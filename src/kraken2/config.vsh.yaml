name: kraken2
description: |
  Kraken2 is a taxonomic sequence classifier that assigns taxonomic labels to sequence reads.
  It uses exact matches of k-mers in a database to classify reads, providing rapid and
  accurate taxonomic classification for metagenomic analysis.
info:
  keywords: [taxonomic classification, metagenomics, kraken]
  links:
    homepage: https://ccb.jhu.edu/software/kraken2/
    documentation: https://ccb.jhu.edu/software/kraken2/index.shtml
    repository: https://github.com/DerrickWood/kraken2
  references:
    doi: 10.1186/s13059-019-1891-0
license: MIT
authors:
  - __merge__: /src/_authors/toni_verbeiren.yaml
    roles: [ author, maintainer ]

argument_groups:
  - name: Inputs
    arguments:
      - name: --reads
        type: file
        multiple: true
        required: true
        description: |
          Input FASTQ file(s). Can be gzipped or bzip2 compressed. Multiple files
          can be provided for paired-end reads or multiple samples.

  - name: Outputs
    arguments:
      - name: --output
        type: file
        direction: output
        required: true
        description: |
          Output file for classification results. Each line contains the classification
          of a single read.

  - name: Database
    arguments:
      - name: --db
        type: file
        required: true
        description: |
          Path to the Kraken2 database directory. This should be a pre-built Kraken2
          database created with kraken2_build.

  - name: Classification
    arguments:
      - name: --threads
        type: integer
        description: |
          Number of threads to use for classification.
        default: 1

      - name: --confidence
        type: double
        description: |
          Confidence score threshold. Reads with scores below this threshold will
          not be classified. Range: 0-1. Default is 0.0 (no threshold).
        default: 0.0

      - name: --minimum_base_quality
        alternatives: [--minimum-base-quality]
        type: integer
        description: |
          Minimum base quality to use in classification. Only effective with FASTQ
          input. Default is 0 (use all bases).
        default: 0

      - name: --quick
        type: boolean_true
        description: |
          Quick operation mode. Uses first hit or hits instead of finding the
          lowest common ancestor (LCA).

      - name: --minimum_hit_groups
        alternatives: [--minimum-hit-groups]
        type: integer
        description: |
          Minimum number of hit groups (overlapping k-mers sharing the same
          minimizer) needed to make a call. Default is 2.
        default: 2

  - name: Output formatting
    arguments:
      - name: --use_names
        alternatives: [--use-names]
        type: boolean_true
        description: |
          Print scientific names instead of just tax IDs in the report.

      - name: --report
        type: file
        direction: output
        description: |
          Print a report with aggregate counts/clade to file. The report shows
          the number of reads assigned to each taxonomic level.

      - name: --report_zero_counts
        alternatives: [--report-zero-counts]
        type: boolean_true
        description: |
          With --report, report counts for ALL taxa, even if counts are zero.

      - name: --report_minimizer_data
        alternatives: [--report-minimizer-data]
        type: boolean_true
        description: |
          With --report, report minimizer and distinct minimizer count
          information in addition to normal Kraken report.

      - name: --use_mpa_style
        alternatives: [--use-mpa-style]
        type: boolean_true
        description: |
          With --report, format report output like Kraken 1's kraken-mpa-report.

  - name: Read filtering
    arguments:
      - name: --classified_out
        alternatives: [--classified-out]
        type: file
        direction: output
        description: |
          Print classified sequences to filename. Classification is defined by
          taxIDs not in the unclassified taxID range.

      - name: --unclassified_out
        alternatives: [--unclassified-out]
        type: file
        direction: output
        description: |
          Print unclassified sequences to filename.

      - name: --paired
        type: boolean_true
        description: |
          The input filenames provided have paired-end reads. When enabled,
          Kraken2 treats consecutive pairs of reads as paired-end reads.

  - name: Compression
    arguments:
      - name: --gzip_compressed
        alternatives: [--gzip-compressed]
        type: boolean_true
        description: |
          Input files are compressed with gzip. If not specified, automatic
          format detection is attempted for regular files.

      - name: --bzip2_compressed
        alternatives: [--bzip2-compressed]
        type: boolean_true
        description: |
          Input files are compressed with bzip2. If not specified, automatic
          format detection is attempted for regular files.

  - name: Database loading
    arguments:
      - name: --memory_mapping
        alternatives: [--memory-mapping]
        type: boolean_true
        description: |
          Avoid loading database into RAM. Instead, use memory-mapped files.
          This can reduce memory usage at the cost of some performance.

resources:
  - type: bash_script
    path: script.sh

test_resources:
  - type: bash_script
    path: test.sh

engines:
  - type: docker
    image: staphb/kraken2:2.1.3
    setup:
      - type: docker
        run: |
          kraken2 --version 2>&1 | sed -n 's/^Kraken version \(.*\)/kraken2: "\1"/p' > /var/software_versions.txt

runners:
  - type: executable
  - type: nextflow
