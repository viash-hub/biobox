name: "dupradar"
argument_groups:
- name: "Input"
  arguments:
  - type: "string"
    name: "--id"
    description: "Sample ID"
    info: null
    default:
    - "id"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--input_bam"
    description: "Path to input alignment file in BAM format"
    info: null
    example:
    - "path/to/file.bam"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--input_gtf"
    description: "Path to GTF annotation file."
    info: null
    example:
    - "path/to/file.gtf"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "boolean_true"
    name: "--paired"
    description: "Add flag if input alignment file consists of paired reads"
    info: null
    direction: "input"
  - type: "integer"
    name: "--strandedness"
    description: "Strandedness of input bam file reads (1 = forward, 2 = reverse or\
      \ 0 = unstranded (default, \napplicable to paired reads))\n"
    info: null
    default:
    - 0
    required: false
    choices:
    - 0
    - 1
    - 2
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Output"
  arguments:
  - type: "file"
    name: "--output_dupmatrix"
    description: "path to output file (txt) of duplicate tag counts"
    info: null
    example:
    - "path/to/dup_matrix.txt"
    must_exist: true
    create_parent: true
    required: false
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output_dup_intercept_mqc"
    description: "path to output file (txt) of multiqc intercept value DupRadar"
    info: null
    example:
    - "path/to/dup_intercept_mqc.txt"
    must_exist: true
    create_parent: true
    required: false
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output_duprate_exp_boxplot"
    description: "Path to output file (pdf) of distribution of expression box plot\n"
    info: null
    example:
    - "path/to/duprate_exp_boxplot.pdf"
    must_exist: true
    create_parent: true
    required: false
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output_duprate_exp_densplot"
    description: "Path to output file (pdf) of 2D density scatter plot of duplicate\
      \ tag counts\n"
    info: null
    example:
    - "path/to/duprate_exp_densityplot.pdf"
    must_exist: true
    create_parent: true
    required: false
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output_duprate_exp_denscurve_mqc"
    description: "Path to output file (txt) of density curve of gene duplication multiqc\n"
    info: null
    example:
    - "path/to/duprate_exp_density_curve_mqc.txt"
    must_exist: true
    create_parent: true
    required: false
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output_expression_histogram"
    description: "Path to output file (pdf) of distribution of RPK values per gene\
      \ histogram\n"
    info: null
    example:
    - "path/to/expression_hist.pdf"
    must_exist: true
    create_parent: true
    required: false
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output_intercept_slope"
    description: "output file (txt) with progression of duplication rate values"
    info: null
    example:
    - "path/to/intercept_slope.txt"
    must_exist: true
    create_parent: true
    required: false
    direction: "output"
    multiple: false
    multiple_sep: ";"
resources:
- type: "r_script"
  path: "script.R"
  is_executable: true
description: "Assessment of duplication rates in RNA-Seq datasets"
test_resources:
- type: "bash_script"
  path: "test.sh"
  is_executable: true
- type: "file"
  path: "test_data"
info: null
status: "enabled"
scope:
  image: "public"
  target: "public"
requirements:
  commands:
  - "ps"
keywords:
- "rnaseq"
- "duplication"
- "genomics"
license: "GPL-3.0"
references:
  doi:
  - "10.1186/s12859-016-1276-2"
links:
  repository: "https://github.com/ssayols/dupRadar"
  homepage: "https://bioconductor.org/packages/release/bioc/html/dupRadar.html"
  documentation: "https://bioconductor.org/packages/release/bioc/vignettes/dupRadar/inst/doc/dupRadar.html"
runners:
- type: "executable"
  id: "executable"
  docker_setup_strategy: "ifneedbepullelsecachedbuild"
- type: "nextflow"
  id: "nextflow"
  directives:
    tag: "$id"
  auto:
    simplifyInput: true
    simplifyOutput: false
    transcript: false
    publish: false
  config:
    labels:
      mem1gb: "memory = 1000000000.B"
      mem2gb: "memory = 2000000000.B"
      mem5gb: "memory = 5000000000.B"
      mem10gb: "memory = 10000000000.B"
      mem20gb: "memory = 20000000000.B"
      mem50gb: "memory = 50000000000.B"
      mem100gb: "memory = 100000000000.B"
      mem200gb: "memory = 200000000000.B"
      mem500gb: "memory = 500000000000.B"
      mem1tb: "memory = 1000000000000.B"
      mem2tb: "memory = 2000000000000.B"
      mem5tb: "memory = 5000000000000.B"
      mem10tb: "memory = 10000000000000.B"
      mem20tb: "memory = 20000000000000.B"
      mem50tb: "memory = 50000000000000.B"
      mem100tb: "memory = 100000000000000.B"
      mem200tb: "memory = 200000000000000.B"
      mem500tb: "memory = 500000000000000.B"
      mem1gib: "memory = 1073741824.B"
      mem2gib: "memory = 2147483648.B"
      mem4gib: "memory = 4294967296.B"
      mem8gib: "memory = 8589934592.B"
      mem16gib: "memory = 17179869184.B"
      mem32gib: "memory = 34359738368.B"
      mem64gib: "memory = 68719476736.B"
      mem128gib: "memory = 137438953472.B"
      mem256gib: "memory = 274877906944.B"
      mem512gib: "memory = 549755813888.B"
      mem1tib: "memory = 1099511627776.B"
      mem2tib: "memory = 2199023255552.B"
      mem4tib: "memory = 4398046511104.B"
      mem8tib: "memory = 8796093022208.B"
      mem16tib: "memory = 17592186044416.B"
      mem32tib: "memory = 35184372088832.B"
      mem64tib: "memory = 70368744177664.B"
      mem128tib: "memory = 140737488355328.B"
      mem256tib: "memory = 281474976710656.B"
      mem512tib: "memory = 562949953421312.B"
      cpu1: "cpus = 1"
      cpu2: "cpus = 2"
      cpu5: "cpus = 5"
      cpu10: "cpus = 10"
      cpu20: "cpus = 20"
      cpu50: "cpus = 50"
      cpu100: "cpus = 100"
      cpu200: "cpus = 200"
      cpu500: "cpus = 500"
      cpu1000: "cpus = 1000"
  debug: false
  container: "docker"
engines:
- type: "docker"
  id: "docker"
  image: "quay.io/biocontainers/bioconductor-dupradar:1.40.0--r45hdfd78af_0"
  namespace_separator: "/"
  setup:
  - type: "docker"
    run:
    - "Rscript -e 'cat(\"dupradar: \", as.character(packageVersion(\"dupRadar\")),\
      \ \"\\n\", sep = \"\")' > /var/software_versions.txt"
  entrypoint: []
  cmd: null
build_info:
  config: "src/dupradar/config.vsh.yaml"
  runner: "executable"
  engine: "docker"
  output: "output"
  executable: "output/dupradar"
  viash_version: "0.9.4"
  git_commit: "b72d827c6d358145ede753aa1565a1c0a5e734fe"
  git_remote: "git@github.com:viash-hub/biobox.git"
  git_tag: "v0.2.0-68-gb72d827"
package_config:
  name: "biobox"
  summary: "A curated collection of high-quality, standalone bioinformatics components\
    \ built with [Viash](https://viash.io).\n"
  description: "`biobox` offers a suite of reliable bioinformatics components, similar\
    \ to [nf-core/modules](https://github.com/nf-core/modules) and [snakemake-wrappers/bio](https://github.com/snakemake/snakemake-wrappers/tree/master/bio),\
    \ but built using the [Viash](https://viash.io) framework.\n\nThis approach emphasizes\
    \ **reusability**, **reproducibility**, and adherence to **best practices**. Key\
    \ features of `biobox` components include:\n\n* **Standalone & Nextflow Ready:**\
    \ Run components directly via the command line or seamlessly integrate them into\
    \ Nextflow workflows.\n* **High Quality Standards:**\n    * Comprehensive documentation\
    \ for components and parameters.\n    * Full exposure of underlying tool arguments.\n\
    \    * Containerized (Docker) for dependency management and reproducibility.\n\
    \    * Unit tested for verified functionality.\n"
  info: null
  viash_version: "0.9.4"
  source: "src"
  target: "target"
  config_mods:
  - ".requirements.commands += ['ps']"
  keywords:
  - "bioinformatics"
  - "modules"
  - "sequencing"
  license: "MIT"
  links:
    repository: "https://github.com/viash-hub/biobox"
    issue_tracker: "https://github.com/viash-hub/biobox/issues"
