name: dupradar
description: Assessment of duplication rates in RNA-Seq datasets
keywords: [ rnaseq, duplication, genomics ]
links:
  homepage: https://bioconductor.org/packages/release/bioc/html/dupRadar.html
  documentation: https://bioconductor.org/packages/release/bioc/vignettes/dupRadar/inst/doc/dupRadar.html
  repository: https://github.com/ssayols/dupRadar
references: 
  doi: "10.1186/s12859-016-1276-2"
license: GPL-3.0

argument_groups:
- name: Input
  arguments: 
  - name: --id
    type: string
    description: Sample ID
    default: "id"
  - name: --input_bam
    type: file 
    required: true
    description: |
      Path to input alignment file in BAM format. Duplicates must already be
      marked (SAM flag `0x400`), e.g. with Picard `MarkDuplicates` or
      `samtools markdup`; dupRadar does not mark them itself.
    example: "path/to/file.bam"
  - name: --input_gtf
    type: file 
    required: true
    description: Path to GTF annotation file.
    example: "path/to/file.gtf"
  - name: --paired
    type: boolean_true
    description: Add flag if input alignment file consists of paired reads
  - name: --strandedness
    type: integer
    choices: [0, 1, 2]
    description: |
      Strandedness of the library: 0 = unstranded, 1 = forward (stranded),
      2 = reverse (reversely stranded).
    default: 0
    
- name: Output
  arguments: 
  - name: --output_dupmatrix
    type: file
    direction: output
    description: path to output file (txt) of duplicate tag counts
    example: "path/to/dup_matrix.txt"
  - name: --output_dup_intercept_mqc
    type: file
    direction: output
    description: path to output file (txt) of multiqc intercept value DupRadar
    example: "path/to/dup_intercept_mqc.txt"
  - name: --output_duprate_exp_boxplot
    type: file
    direction: output
    description: |
      Path to output file (pdf) of distribution of expression box plot
    example: "path/to/duprate_exp_boxplot.pdf"
  - name: --output_duprate_exp_densplot
    type: file
    direction: output
    description: |
      Path to output file (pdf) of 2D density scatter plot of duplicate tag counts
    example: "path/to/duprate_exp_densityplot.pdf"
  - name: --output_duprate_exp_denscurve_mqc
    type: file
    direction: output
    description: |
      Path to output file (txt) of density curve of gene duplication multiqc
    example: "path/to/duprate_exp_density_curve_mqc.txt"
  - name: --output_expression_histogram
    type: file
    direction: output
    description: |
      Path to output file (pdf) of distribution of RPK values per gene histogram
    example: "path/to/expression_hist.pdf"
  - name: --output_intercept_slope
    type: file
    direction: output
    description: output file (txt) with progression of duplication rate values
    example: "path/to/intercept_slope.txt"

resources:
  # Adapted from https://github.com/nf-core/rnaseq/blob/3.12.0/bin/dupradar.r
  - type: r_script
    path: script.R
test_resources:
  - type: bash_script
    path: test.sh
  - type: file
    path: test_data
  - path: /src/_utils/test_helpers.sh

engines:
  - type: docker
    image: quay.io/biocontainers/bioconductor-dupradar:1.40.0--r45hdfd78af_0
    setup:
      - type: docker
        run:
          - 'Rscript -e ''cat("dupradar: ", as.character(packageVersion("dupRadar")), "\n", sep = "")'' > /var/software_versions.txt'

runners:
  - type: executable  
  - type: nextflow
